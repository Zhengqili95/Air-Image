camera:
  # 相機擺法。front：相機正對鍵盤面（桌面白紙版），先掃描表面深度再點三點校正。
  # overhead：相機在垂直的空中鍵盤面正上方往下看（擺法 A）；用指尖在紙卡上描出平面再點三點，
  # 法向量朝向手所在的那一側，指尖位置以深度圖修正。
  mounting: overhead
  depth_work_mode: ""
  depth_precision: 1mm
  preferred_fps: 30
  sdk_temporal_filter: true
  sdk_spatial_filter: true
  hole_filling_filter: false
  rgb_power_line_frequency_hz: 60

depth:
  sample_radius: 2
  median_window_size: 5
  max_jump_mm: 80.0
  invalid_reset_frames: 3
  # 表面掃描時,比指尖再近超過這個距離的樣本視為手指而捨棄。手指從指尖往後是往上抬離桌面的,
  # 所以手指像素比指尖更靠近相機;桌面像素則與指尖同深或更遠,指尖貼著桌面時也成立。
  finger_clearance_mm: 3.0
  # 表面掃描的取樣半徑與間隔(像素)。半徑必須涵蓋鍵盤的相當比例:若只取樣一條細帶,
  # 平面法向量可以繞著細帶自由旋轉,而殘差和內點數完全看不出這個問題。
  surface_scan_radius_px: 150
  surface_scan_stride_px: 5
  # 距離任一手部關鍵點這麼近的像素一律不當成表面。手掌貼在目標上時與目標幾乎共面,單靠深度分不開。
  hand_exclusion_px: 40.0
  # 比指尖再遠超過這個距離的樣本視為背景,不是要掃描的目標表面。
  surface_depth_window_mm: 150.0

fingertip:
  min_cutoff_hz: 1.0
  beta: 0.12
  derivative_cutoff_hz: 1.0
  display_hold_ms: 100
  # 深度探測點落在「指尖 -> 食指 DIP 關節」連線上的比例;指尖本身位於輪廓邊緣,深度不可靠。
  depth_probe_near_ratio: 0.35
  depth_probe_far_ratio: 0.70
  # 只用於 overhead：深度與手指探測點相差在此範圍內的像素視為手指，用來找指尖最前端。
  # 從上方看，手指下方的背景離相機遠很多，所以很容易切開。
  depth_segment_window_mm: 25.0
  # 沿手指方向一像素一像素往前看，最前面一段「寬度仍有手指平均寬度這個比例」的位置就是指尖最前端；
  # 輪廓邊緣零星的雜點寬度只有一兩個像素，會被略過。
  edge_width_ratio: 0.3
  # 只用於 overhead：以毫米為單位平滑指尖 3D 位置（One Euro）。用毫米而不是像素，
  # 離相機近的上排和遠的下排才會得到一樣的平滑程度。抖動仍大就降低 min_cutoff，反應太慢就提高 beta。
  position_min_cutoff_hz: 1.0
  position_beta: 0.05
  # 只用於 overhead：MediaPipe 追丟手（常見於從上方看手背）後，最多再用深度圖跟著手指多久（毫秒）；0 為關閉。
  depth_coast_ms: 1000

# MediaPipe 手部追蹤的信心門檻（MediaPipe 預設都是 0.5）。從上方看手背時分數偏低，
# 容易被判定為「手不見了」而追丟；調低 presence／tracking 可以讓已經找到的手不容易掉。
# 需要重新建置過的 mediapipe_hand_bridge.dll 才會生效；舊版 DLL 會沿用 0.5，HUD 會顯示提醒。
hand_tracking:
  min_detection_confidence: 0.5
  min_presence_confidence: 0.3
  min_tracking_confidence: 0.3

touch:
  touch_threshold_mm: 10.0
  release_threshold_mm: 20.0
  min_approach_velocity_mm_s: 40.0
  tracking_timeout_ms: 300
  # 停留在觸控門檻內達此時間即觸發,補足接近速度不足的慢速按壓;設為 0 可關閉。
  dwell_ms: 350

keypad:
  boundary_hysteresis_mm: 2.0

calibration:
  minimum_point_distance_mm: 80.0
  required_samples: 18
  mad_multiplier: 3.5
  minimum_outlier_threshold_mm: 2.0

input:
  # 英文模式的選字方式。two_step：按 7 後上排變成 p q r s，再按一次選字母，每個字母固定按 2 次、不用計時；
  # multitap：像手機一樣連按同一鍵換字母，停 multitap_timeout_ms 後自動確定。
  letter_selection: two_step
  multitap_timeout_ms: 1200
